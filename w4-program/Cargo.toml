[package]
name = "counter"
version = "0.1.0"
edition = "2024"

[dependencies]
borsh = { version = "1.8.1", features = ["derive"] }
solana-program = "5.1.0"

[dev-dependencies]
solana-program-test = "3.1"
solana-sdk = "3"
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
tokio = { version = "1.53.1", features = ["macros"] }

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["custom-panic"]
no-entrypoint = []
custom-heap = []
custom-panic = []

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
